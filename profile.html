<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Shop BD - Profile</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Back Button */
    .header {
      background-color: #1e293b;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #3b82f6;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      font-size: 16px;
      transition: 0.2s;
    }
    .back-btn:hover {
      background: #3b82f6;
      color: #fff;
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
    }

    /* Profile Container */
    .container {
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    /* Welcome Card */
    .welcome-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .profile-avatar {
      font-size: 50px;
      color: #3b82f6;
      margin-bottom: 10px;
    }
    .welcome-card h2 {
      font-size: 18px;
      color: #f8fafc;
      margin-bottom: 5px;
    }
    .welcome-card h2 span {
      color: #3b82f6;
    }

    /* Details Card */
    .info-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }
    .info-item:last-child {
      border-bottom: none;
    }
    .info-label {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
    }

    /* History Section */
    .section-title {
      font-size: 16px;
      color: #3b82f6;
      margin: 15px 0 10px 0;
      font-weight: 600;
    }
    .history-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .empty-msg {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      padding: 10px 0;
    }

    /* Order Item Custom Styling */
    .order-item {
      border-bottom: 1px solid #334155;
      padding: 12px 0;
    }
    .order-item:last-child {
      border-bottom: none;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 5px;
    }
    .order-details {
      font-size: 12px;
      color: #94a3b8;
    }
    .order-details p {
      margin-top: 3px;
    }
    .delivered-box {
      margin-top: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px;
      border-radius: 6px;
      color: #38bdf8;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Top Header with Back Button -->
  <div class="header">
    <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="header-title">My Profile</div>
  </div>

  <div class="container">
    
    <!-- Welcome Card -->
    <div class="welcome-card">
      <div class="profile-avatar">
        <i class="fa-solid fa-circle-user"></i>
      </div>
      <h2>Welcome Your Profile <br>Hi <span id="welcomeName">Loading...</span></h2>
    </div>

    <!-- User Information -->
    <div class="info-card">
      <div class="info-item">
        <span class="info-label"><i class="fa-solid fa-user"></i> Username</span>
        <span class="info-value" id="usernameText">Loading...</span>
      </div>
      <div class="info-item">
        <span class="info-label"><i class="fa-solid fa-envelope"></i> Gmail</span>
        <span class="info-value" id="emailText">Loading...</span>
      </div>
    </div>

    <!-- Balance Add History Section -->
    <h3 class="section-title"><i class="fa-solid fa-wallet"></i> Balance Add History</h3>
    <div class="history-card" id="balanceHistory">
      <p class="empty-msg">No balance history found.</p>
    </div>

    <!-- Order History Section -->
    <h3 class="section-title"><i class="fa-solid fa-bag-shopping"></i> Order History</h3>
    <div class="history-card" id="orderHistory">
      <p class="empty-msg">Loading orders...</p>
    </div>

  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAz-zkj7o-5w47U2AFAdXWvpa0uYaF9VFw",
      authDomain: "mail-shop-bd.firebaseapp.com",
      databaseURL: "https://mail-shop-bd-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mail-shop-bd",
      storageBucket: "mail-shop-bd.firebasestorage.app",
      messagingSenderId: "19603951400",
      appId: "1:19603951400:web:4eedb894f65ba908898a1d",
      measurementId: "G-5T3HESJSW2"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const welcomeName = document.getElementById('welcomeName');
    const usernameText = document.getElementById('usernameText');
    const emailText = document.getElementById('emailText');
    const orderHistoryContainer = document.getElementById('orderHistory');

    // Authentication Guard & User Profile Data Loading
    auth.onAuthStateChanged(user => {
      if (user) {
        // Set Email
        emailText.textContent = user.email || "N/A";

        // Fetch Username & Details from Firebase Realtime Database
        db.ref('users/' + user.uid).once('value').then(snapshot => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            const username = data.username || user.displayName || "User";
            welcomeName.textContent = username;
            usernameText.textContent = username;
          } else {
            const defaultName = user.displayName || "User";
            welcomeName.textContent = defaultName;
            usernameText.textContent = defaultName;
          }
        });

        // Load combined orders from both 'user_orders' and 'orders'
        loadUserOrders(user.uid);

      } else {
        // User not logged in -> redirect to login page
        window.location.href = "index.html";
      }
    });

    // Function to Fetch Orders from both nodes
    function loadUserOrders(userId) {
      const userOrdersRef = db.ref('user_orders/' + userId);
      const ordersRef = db.ref('orders').orderByChild('userId').equalTo(userId);

      // Fetch data from both nodes simultaneously
      Promise.all([
        userOrdersRef.once('value'),
        ordersRef.once('value')
      ]).then(([userOrdersSnap, ordersSnap]) => {
        const combinedOrdersMap = {};

        // 1. Process orders from 'user_orders/{userId}'
        if (userOrdersSnap.exists()) {
          const userOrdersData = userOrdersSnap.val();
          Object.keys(userOrdersData).forEach(key => {
            combinedOrdersMap[key] = { id: key, ...userOrdersData[key] };
          });
        }

        // 2. Process orders from 'orders'
        if (ordersSnap.exists()) {
          const ordersData = ordersSnap.val();
          Object.keys(ordersData).forEach(key => {
            // Merge properties if order already exists or add new
            combinedOrdersMap[key] = {
              ...(combinedOrdersMap[key] || {}),
              id: key,
              ...ordersData[key]
            };
          });
        }

        const allOrders = Object.values(combinedOrdersMap);

        if (allOrders.length === 0) {
          orderHistoryContainer.innerHTML = '<p class="empty-msg">No order history found.</p>';
          return;
        }

        // Sort orders by timestamp / date (Latest first)
        allOrders.sort((a, b) => {
          const timeA = a.timestamp || (a.date ? new Date(a.date).getTime() : 0);
          const timeB = b.timestamp || (b.date ? new Date(b.date).getTime() : 0);
          return timeB - timeA;
        });

        // Render Orders to UI
        orderHistoryContainer.innerHTML = '';
        allOrders.forEach(order => {
          const title = order.title || order.category || 'Order';
          const price = order.totalPrice !== undefined ? order.totalPrice : 0;
          const quantity = order.quantity || 1;

          // Format Delivered Data
          let deliveredDataText = '';
          if (Array.isArray(order.deliveredData)) {
            deliveredDataText = order.deliveredData.join('<br>');
          } else if (typeof order.deliveredData === 'object' && order.deliveredData !== null) {
            deliveredDataText = Object.values(order.deliveredData).join('<br>');
          } else if (order.deliveredData) {
            deliveredDataText = order.deliveredData;
          } else {
            deliveredDataText = 'N/A';
          }

          // Format Date
          let dateStr = 'N/A';
          if (order.date) {
            dateStr = new Date(order.date).toLocaleString();
          } else if (order.timestamp) {
            dateStr = new Date(order.timestamp).toLocaleString();
          }

          const html = `
            <div class="order-item">
              <div class="order-header">
                <span>${title}</span>
                <span>$ ${price}</span>
              </div>
              <div class="order-details">
                <p><strong>Quantity:</strong> ${quantity}</p>
                <p><strong>Date:</strong> ${dateStr}</p>
                <div class="delivered-box">
                  <strong>Delivered Data:</strong><br>${deliveredDataText}
                </div>
              </div>
            </div>
          `;
          orderHistoryContainer.innerHTML += html;
        });

      }).catch(error => {
        console.error("Error fetching orders:", error);
        orderHistoryContainer.innerHTML = '<p class="empty-msg">Error loading orders.</p>';
      });
    }
  </script>
</body>
</html>
