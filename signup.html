<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Shop BD - Sign Up</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background-color: #1e293b;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 {
      color: #3b82f6;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header p {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 5px;
    }
    .input-group {
      margin-bottom: 18px;
      position: relative;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-group input {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus {
      border-color: #3b82f6;
    }
    #usernameStatus, #passwordStatus {
      position: absolute;
      right: 40px;
      font-size: 11px;
      font-weight: 600;
    }
    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 15px;
    }
    .helper-text {
      font-size: 11px;
      margin-top: 4px;
      color: #94a3b8;
    }
    .btn-submit {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background-color: #1d4ed8;
    }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }
    .footer-text a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-text a:hover {
      text-decoration: underline;
    }
    #toast {
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }
    .toast-success {
      background-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .toast-error {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .toast-info {
      background-color: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Global Shop BD</h1>
      <p>Create a new account</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <form id="signupForm">
      
      <!-- Username Field -->
      <div class="input-group">
        <label>Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" required placeholder="e.g. imon123" autocomplete="off">
          <span id="usernameStatus"></span>
        </div>
      </div>

      <!-- Email Field -->
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="yourname@gmail.com">
      </div>

      <!-- Password Field -->
      <div class="input-group">
        <label>Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" required placeholder="••••••••">
          <span id="passwordStatus"></span>
          <button type="button" id="togglePassword" class="toggle-password">
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </button>
        </div>
        <div id="passwordHelper" class="helper-text">Must be at least 6 characters</div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="btn-submit">SignUp</button>

    </form>

    <!-- Sign In Redirect Link -->
    <div class="footer-text">
      Have An Account? <a href="index.html">SignIn Now</a>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAz-zkj7o-5w47U2AFAdXWvpa0uYaF9VFw",
      authDomain: "mail-shop-bd.firebaseapp.com",
      databaseURL: "https://mail-shop-bd-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mail-shop-bd",
      storageBucket: "mail-shop-bd.firebasestorage.app",
      messagingSenderId: "19603951400",
      appId: "1:19603951400:web:4eedb894f65ba908898a1d",
      measurementId: "G-5T3HESJSW2"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const usernameInput = document.getElementById('username');
    const usernameStatus = document.getElementById('usernameStatus');
    const passwordInput = document.getElementById('password');
    const passwordStatus = document.getElementById('passwordStatus');
    const passwordHelper = document.getElementById('passwordHelper');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const signupForm = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const toast = document.getElementById('toast');

    let isUsernameAvailable = false;
    let isPasswordValid = false;

    function showNotification(message, type = 'info') {
      toast.textContent = message;
      toast.style.display = 'block';
      toast.className = '';
      
      if (type === 'error') {
        toast.classList.add('toast-error');
      } else if (type === 'success') {
        toast.classList.add('toast-success');
      } else {
        toast.classList.add('toast-info');
      }
    }

    // Password Show/Hide
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      eyeIcon.classList.toggle('fa-eye');
      eyeIcon.classList.toggle('fa-eye-slash');
    });

    // Realtime Username Check
    let debounceTimer;
    usernameInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const username = usernameInput.value.trim().toLowerCase();
      
      if (username.length < 3) {
        usernameStatus.textContent = "Too short";
        usernameStatus.style.color = "#eab308";
        isUsernameAvailable = false;
        return;
      }

      usernameStatus.textContent = "Checking...";
      usernameStatus.style.color = "#94a3b8";

      debounceTimer = setTimeout(() => {
        db.ref('usernames/' + username).once('value', snapshot => {
          if (snapshot.exists()) {
            usernameStatus.textContent = "Taken ✕";
            usernameStatus.style.color = "#ef4444";
            isUsernameAvailable = false;
          } else {
            usernameStatus.textContent = "Available ✓";
            usernameStatus.style.color = "#22c55e";
            isUsernameAvailable = true;
          }
        });
      }, 500);
    });

    // Realtime Password 6-Digit Check
    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;

      if (password.length === 0) {
        passwordStatus.textContent = "";
        passwordHelper.textContent = "Must be at least 6 characters";
        passwordHelper.style.color = "#94a3b8";
        isPasswordValid = false;
      } else if (password.length < 6) {
        passwordStatus.textContent = "Too short ✕";
        passwordStatus.style.color = "#ef4444";
        passwordHelper.textContent = `Need ${6 - password.length} more characters`;
        passwordHelper.style.color = "#ef4444";
        isPasswordValid = false;
      } else {
        passwordStatus.textContent = "Valid ✓";
        passwordStatus.style.color = "#22c55e";
        passwordHelper.textContent = "Strong password";
        passwordHelper.style.color = "#22c55e";
        isPasswordValid = true;
      }
    });

    // Form Submit
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = usernameInput.value.trim().toLowerCase();
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      if (!isUsernameAvailable) {
        showNotification("Please enter an available username!", "error");
        return;
      }

      if (!isPasswordValid) {
        showNotification("Password must be at least 6 characters long!", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Processing...";

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        await db.ref('users/' + user.uid).set({
          uid: user.uid,
          username: username,
          email: email,
          balance: 0.00
        });

        await db.ref('usernames/' + username).set(user.uid);
        await user.sendEmailVerification();

        showNotification("Send Email Verification Link Send Please Verified Redirect to Login Page", "success");

        setTimeout(async () => {
          await auth.signOut();
          window.location.href = "index.html";
        }, 4000);

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = "SignUp";

        if (error.code === 'auth/email-already-in-use') {
          showNotification("This email is already registered!", "error");
        } else if (error.code === 'auth/weak-password') {
          showNotification("Password should be at least 6 characters!", "error");
        } else {
          showNotification(error.message, "error");
        }
      }
    });
  </script>
</body>
</html>
