<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance - Mail Shop BD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }

    body { 
      background-color: #0b1120; 
      color: #f8fafc; 
      min-height: 100vh; 
      padding: 20px; 
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    .header { 
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 20px; 
    }
    
    .back-btn {
      background: #1e293b;
      color: #3b82f6;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-btn:hover { 
      background: #334155; 
      color: #fff; 
    }

    /* Main Content Container */
    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }

    .status-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 35px 25px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* Animated Spinner Icon */
    .loading-icon {
      font-size: 45px;
      color: #3b82f6;
      margin-bottom: 20px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .main-text {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .sub-text {
      font-size: 15px;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 25px;
      background: #020617;
      padding: 15px;
      border-radius: 10px;
      border: 1px dashed #334155;
    }

    .support-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(90deg, #2563eb, #1d4ed8);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      transition: opacity 0.2s ease;
    }

    .support-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Top Left Back Button Header -->
  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <i class="fa-solid fa-arrow-left"></i> Back
    </button>
  </div>

  <!-- Main Message Box -->
  <div class="main-container">
    <div class="status-card">
      <div class="loading-icon">
        <i class="fa-solid fa-gear"></i>
      </div>
      
      <div class="main-text">
        Please waiting this page working running
      </div>

      <div class="sub-text">
        আপনার যদি ইমারজেন্সি নাম্বার লাগে তাহলে সাপোর্ট যোগাযোগ করেন সমস্যা সমাধান করে দেওয়া হবে। সাথেই থাকুন ধন্যবাদ।
      </div>

      <!-- Updated Direct Telegram Inbox Link -->
      <a href="https://t.me/Md_Emon_Mia" target="_blank" class="support-btn">
        <i class="fa-brands fa-telegram"></i> সাপোর্টে যোগাযোগ করুন
      </a>
    </div>
  </div>

</body>
</html>
